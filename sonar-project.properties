# SonarQube Project Configuration - WealthArena
sonar.projectKey=AIP-F25-1_WealthArena
sonar.projectName=WealthArena
sonar.projectVersion=1.0.0
sonar.organization=aip-f25-1

# Source code locations
sonar.sources=backend/src,frontend,chatbot/app,rl-service/api,data-pipeline
sonar.tests=backend/src/__tests__,frontend/__tests__,chatbot/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/data/**,**/models/**,**/checkpoints/**,**/logs/**,**/notebooks/**,**/*.min.js,**/*.bundle.js,**/coverage/**,**/.expo/**,**/android/**,**/ios/**

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Python settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=**/coverage.xml

# Test patterns
sonar.test.inclusions=**/*test*.ts,**/*test*.tsx,**/*test*.js,**/*test*.jsx,**/test_*.py,**/*_test.py

