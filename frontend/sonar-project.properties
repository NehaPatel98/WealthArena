# SonarQube Configuration - Frontend (React Native/TypeScript)
sonar.projectKey=wealtharena-frontend
sonar.projectName=WealthArena Frontend
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=.
sonar.tests=.

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/android/**,**/ios/**,**/*.min.js,**/*.bundle.js,**/coverage/**

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test patterns
sonar.test.inclusions=**/*test*.ts,**/*test*.tsx,**/*test*.js,**/*test*.jsx,**/*spec*.ts,**/*spec*.tsx

# Encoding
sonar.sourceEncoding=UTF-8

