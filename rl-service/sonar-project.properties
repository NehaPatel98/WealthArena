# SonarQube Configuration - RL Service (Python/Flask)
sonar.projectKey=wealtharena-rl-service
sonar.projectName=WealthArena RL Service
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=api
sonar.tests=.

# Python settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/models/**,**/checkpoints/**,**/logs/**

# Test patterns
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Encoding
sonar.sourceEncoding=UTF-8

