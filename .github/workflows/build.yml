name: Build

on:
  push:
    branches:
      - dev
      - ui
      - chatbot
      - data
      - db
      - main
      - ml-infra
      - rl
      - test
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis relevancy

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=AIP-F25-1_WealthArena
            -Dsonar.organization=AIP-F25-1
            -Dsonar.projectBaseDir=.
            -Dsonar.sources=backend/src,frontend,chatbot/app,rl-service/api,data-pipeline
            -Dsonar.tests=backend/src/__tests__,frontend/__tests__,chatbot/tests
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/data/**,**/models/**,**/checkpoints/**,**/logs/**,**/notebooks/**,**/*.min.js,**/*.bundle.js,**/coverage/**,**/.expo/**,**/android/**,**/ios/**,**/*.java
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.test.inclusions=**/*test*.ts,**/*test*.tsx,**/*test*.js,**/*test*.jsx,**/test_*.py,**/*_test.py
