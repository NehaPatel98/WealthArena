checkpointing:
  checkpoint_freq: 25
  keep_checkpoints_num: 10
  save_best_only: true
data:
  cache_enabled: true
  end_date: '2024-12-31'
  interval: 1d
  source: yfinance
  start_date: '2020-01-01'
  symbols:
  - AAPL
  - GOOGL
  - MSFT
  - TSLA
  - AMZN
  - NVDA
  - META
  - NFLX
  - AMD
  - INTC
  - JPM
  - JNJ
  - V
  - PG
  - UNH
  - HD
  - MA
  - DIS
  - PYPL
  - ADBE
environment:
  episode_length: 252
  initial_cash_per_agent: 1000000
  lookback_window_size: 30
  num_agents: 5
  num_assets: 20
  reward_weights:
    cost: 0.1
    profit: 2.0
    risk: 0.5
    sharpe: 1.0
    stability: 0.05
  slippage_rate: 0.0002
  transaction_cost_rate: 0.0005
evaluation:
  benchmark_symbols:
  - SPY
  - QQQ
  - IWM
  eval_duration: 20
  eval_episodes: 50
  eval_interval: 25
experiment_tracking:
  mlflow:
    enabled: true
    experiment_name: WealthArena_Production
    tracking_uri: http://localhost:5000
  wandb:
    enabled: true
    entity: wealtharena
    project: wealtharena-trading
resources:
  num_cpus_per_worker: 2
  num_envs_per_worker: 2
  num_gpus: 0
  num_workers: 4
risk_management:
  correlation_limit: 0.7
  max_drawdown_limit: 0.15
  max_portfolio_risk: 0.12
  max_position_size: 0.15
  stop_loss_threshold: 0.08
  take_profit_threshold: 0.2
  var_confidence: 0.95
training:
  algorithm: PPO
  clip_param: 0.2
  early_stopping: true
  entropy_coeff: 0.01
  gae_lambda: 0.95
  gamma: 0.995
  learning_rate: 0.0001
  max_iterations: 2000
  num_sgd_iter: 20
  patience: 100
  sgd_minibatch_size: 256
  target_reward: 500.0
  train_batch_size: 8000
  vf_loss_coeff: 0.5
