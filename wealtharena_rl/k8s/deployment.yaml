apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealtharena-rl
  labels:
    app: wealtharena-rl
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wealtharena-rl
  template:
    metadata:
      labels:
        app: wealtharena-rl
    spec:
      containers:
      - name: wealtharena-rl
        image: wealtharenaregistry.azurecr.io/wealtharena-rl:latest
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONPATH
          value: /app
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATA_DIR
          value: /app/data
        - name: MODELS_DIR
          value: /app/models
        - name: RESULTS_DIR
          value: /app/results
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: models-volume
          mountPath: /app/models
        - name: results-volume
          mountPath: /app/results
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: wealtharena-data-pvc
      - name: models-volume
        persistentVolumeClaim:
          claimName: wealtharena-models-pvc
      - name: results-volume
        persistentVolumeClaim:
          claimName: wealtharena-results-pvc
