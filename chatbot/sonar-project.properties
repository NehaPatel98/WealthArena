# SonarQube Configuration - Chatbot (Python/FastAPI)
sonar.projectKey=wealtharena-chatbot
sonar.projectName=WealthArena Chatbot
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=app
sonar.tests=tests

# Python settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/data/**,**/models/**,**/logs/**,**/notebooks/**

# Test patterns
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Encoding
sonar.sourceEncoding=UTF-8
