# SonarQube Configuration - Backend (Node.js/TypeScript)
sonar.projectKey=wealtharena-backend
sonar.projectName=WealthArena Backend
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=src
sonar.tests=src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js,**/*.bundle.js

# TypeScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test patterns
sonar.test.inclusions=**/*test*.ts,**/*spec*.ts

# Encoding
sonar.sourceEncoding=UTF-8

