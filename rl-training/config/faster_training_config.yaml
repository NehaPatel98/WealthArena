# Faster Training Configuration
# Optimized for faster validation (30-45 minutes) - quick test with reasonable training
# Use this to verify training works properly before committing to longer runs

checkpointing:
  checkpoint_freq: 15
  keep_checkpoints_num: 3
  save_best_only: true

data:
  cache_enabled: true
  end_date: '2025-01-01'
  interval: 1d
  source: processed_csvs
  start_date: '2023-01-01'  # 2 years of data
  data_path: 'data/processed'
  max_symbols: 20  # Limited symbols for faster training

environment:
  episode_length: 189  # 9 months episodes
  initial_cash: 1000000
  initial_cash_per_agent: 1000000
  lookback_window_size: 25  # Moderate window
  num_agents: 1
  num_assets: 15  # Moderate assets
  transaction_cost_rate: 0.001
  slippage_rate: 0.0005
  reward_weights:
    cost: 0.1
    profit: 3.0
    risk: 1.0
    sharpe: 1.5
    stability: 0.05
    trend_reversal: 2.5
    win_rate_bonus: 2.0

evaluation:
  benchmark_symbols:
  - SPY
  - QQQ
  eval_duration: 8
  eval_episodes: 10  # Limited evaluation
  eval_interval: 15

experiment_tracking:
  mlflow:
    enabled: false  # Disable for faster mode
    experiment_name: WealthArena_Faster_Training
    tracking_uri: http://localhost:5000
  wandb:
    enabled: false

resources:
  num_cpus_per_worker: 1
  num_envs_per_worker: 2
  num_gpus: 0
  num_workers: 3  # Moderate workers

risk_management:
  correlation_limit: 0.7
  max_drawdown_limit: 0.15
  max_portfolio_risk: 0.12
  max_position_size: 0.15
  stop_loss_threshold: 0.08
  take_profit_threshold: 0.20
  var_confidence: 0.95

training:
  algorithm: PPO
  clip_param: 0.2
  early_stopping: true
  entropy_coeff: 0.01
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_iterations: 100  # Limited iterations for faster training
  num_sgd_iter: 8  # Moderate SGD iterations
  patience: 30
  sgd_minibatch_size: 96  # Smaller batches
  target_reward: 200.0  # Moderate target
  target_win_rate: 0.65  # Moderate target
  train_batch_size: 2000  # Moderate batch size
  vf_loss_coeff: 0.5
  win_rate_weight: 2.0

