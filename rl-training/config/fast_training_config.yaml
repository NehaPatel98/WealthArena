# Fast Training Configuration
# Optimized for fast training (1-1.5 hours) - good balance of speed and quality
# Use this for regular development and testing

checkpointing:
  checkpoint_freq: 20
  keep_checkpoints_num: 4
  save_best_only: true

data:
  cache_enabled: true
  end_date: '2025-01-01'
  interval: 1d
  source: processed_csvs
  start_date: '2022-01-01'  # 3 years of data
  data_path: 'data/processed'
  max_symbols: 30  # Moderate symbols for fast training

environment:
  episode_length: 252
  initial_cash: 1000000
  initial_cash_per_agent: 1000000
  lookback_window_size: 30
  num_agents: 1
  num_assets: 20
  transaction_cost_rate: 0.001
  slippage_rate: 0.0005
  reward_weights:
    cost: 0.1
    profit: 3.0
    risk: 1.0
    sharpe: 1.5
    stability: 0.05
    trend_reversal: 2.5
    win_rate_bonus: 2.0

evaluation:
  benchmark_symbols:
  - SPY
  - QQQ
  - IWM
  eval_duration: 10
  eval_episodes: 15  # Moderate evaluation
  eval_interval: 20

experiment_tracking:
  mlflow:
    enabled: true
    experiment_name: WealthArena_Fast_Training
    tracking_uri: http://localhost:5000
  wandb:
    enabled: false

resources:
  num_cpus_per_worker: 1
  num_envs_per_worker: 2
  num_gpus: 0
  num_workers: 4

risk_management:
  correlation_limit: 0.7
  max_drawdown_limit: 0.15
  max_portfolio_risk: 0.12
  max_position_size: 0.15
  stop_loss_threshold: 0.08
  take_profit_threshold: 0.20
  var_confidence: 0.95

training:
  algorithm: PPO
  clip_param: 0.2
  early_stopping: true
  entropy_coeff: 0.01
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_iterations: 200  # Fast training iterations
  num_sgd_iter: 10
  patience: 40
  sgd_minibatch_size: 112  # Moderate batches
  target_reward: 250.0  # Good target
  target_win_rate: 0.68  # Good target
  train_batch_size: 3000  # Moderate batch size
  vf_loss_coeff: 0.5
  win_rate_weight: 2.0

