# Fastest Training Configuration - Smoke Test
# Optimized for fastest validation (10-15 minutes) - minimal training to verify setup works
# Use this to quickly verify training works without wasting time

checkpointing:
  checkpoint_freq: 10
  keep_checkpoints_num: 2
  save_best_only: true

data:
  cache_enabled: true
  end_date: '2025-01-01'
  interval: 1d
  source: processed_csvs
  start_date: '2024-01-01'  # Only 1 year of data for fastest training
  data_path: 'data/processed'
  max_symbols: 10  # Minimal symbols for fastest training

environment:
  episode_length: 126  # 6 months episodes
  initial_cash: 1000000
  initial_cash_per_agent: 1000000
  lookback_window_size: 20  # Smaller window
  num_agents: 1
  num_assets: 10  # Minimal assets
  transaction_cost_rate: 0.001
  slippage_rate: 0.0005
  reward_weights:
    cost: 0.1
    profit: 3.0
    risk: 1.0
    sharpe: 1.5
    stability: 0.05
    trend_reversal: 2.5
    win_rate_bonus: 2.0

evaluation:
  benchmark_symbols:
  - SPY
  eval_duration: 5
  eval_episodes: 5  # Minimal evaluation
  eval_interval: 10

experiment_tracking:
  mlflow:
    enabled: false  # Disable for fastest mode
    experiment_name: WealthArena_Fastest_Training
    tracking_uri: http://localhost:5000
  wandb:
    enabled: false

resources:
  num_cpus_per_worker: 1
  num_envs_per_worker: 1  # Minimal parallelism
  num_gpus: 0
  num_workers: 2  # Minimal workers

risk_management:
  correlation_limit: 0.7
  max_drawdown_limit: 0.15
  max_portfolio_risk: 0.12
  max_position_size: 0.15
  stop_loss_threshold: 0.08
  take_profit_threshold: 0.20
  var_confidence: 0.95

training:
  algorithm: PPO
  clip_param: 0.2
  early_stopping: true
  entropy_coeff: 0.01
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_iterations: 50  # Minimal iterations for smoke test
  num_sgd_iter: 5  # Fewer SGD iterations
  patience: 20
  sgd_minibatch_size: 64  # Smaller batches
  target_reward: 100.0  # Lower target
  target_win_rate: 0.60  # Lower target for fastest
  train_batch_size: 1000  # Smaller batch size
  vf_loss_coeff: 0.5
  win_rate_weight: 2.0

